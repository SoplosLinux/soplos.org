<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soplos Linux · Apps 3.0</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #09090c;
    --fg: #f7efe4;
    --mut: #a8a196;
    --o1: #ffc21f;
    --o2: #ff8a14;
    --o3: #ff4a14;
    --a1: #ffc21f;
    --a2: #ff6a12;
    --ease: cubic-bezier(.2, .9, .2, 1);
    --pop: cubic-bezier(.2, 1.25, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: Inter, "Segoe UI", "Helvetica Neue", Ubuntu, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .grid-bg { position: fixed; inset: -2px; z-index: 0; pointer-events: none; opacity: .55;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%);
    animation: gridMove 18s linear infinite; }
  @keyframes gridMove { to { background-position: 64px 64px; } }

  /* ---------- scenes ----------
     Sizes depend on the width and the height of the window (vmin and vh), and
     --k shrinks every text of a scene when its content does not fit (see fit()). */
  .scene { --k: 1; position: fixed; inset: 0; z-index: 1; visibility: hidden; opacity: 0;
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: center; gap: 2vw;
    padding: 10vh 7vw 13vh; transition: opacity .45s ease, visibility 0s .45s; }
  .scene.on { visibility: visible; opacity: 1; transition: opacity .5s ease .2s, visibility 0s; }

  /* ---------- the light behind the scenes, as in the installer ----------
     Two glows for the whole presentation: the big one behind the icon and a
     smaller one low in the opposite corner. On every change of scene both glide
     to their new place and take the colors of the app, and they never stand
     still: a slow drift on top of a pulse. The movements are transforms of
     nested boxes, so the browser moves the light without painting it again;
     only the color is painted while it changes. */
  @property --b1 { syntax: "<color>"; inherits: true; initial-value: #ffc21f; }
  /* The drift box does not clip: with the drift its edge came into view as a
     line across the screen. The page already hides what goes past the window.
     The sizes follow the larger side of the window, so on a phone held upright
     the lights weigh as much as on a wide screen. */
  .glow-drift { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    animation: bgDrift 23s ease-in-out infinite alternate; }
  .glow { position: absolute; left: 0; top: 0; width: max(112vw, 62vh); height: max(112vw, 62vh); will-change: transform;
    transition: transform 1.6s cubic-bezier(.6, 0, .3, 1); }
  .glow.low { width: max(88vw, 52vh); height: max(88vw, 52vh); }
  .glow i { position: absolute; inset: 0; border-radius: 50%; opacity: .36; will-change: transform;
    background: radial-gradient(circle closest-side, var(--b1), transparent 62%);
    transition: --b1 1.4s ease;
    animation: bgPulse 7s ease-in-out infinite alternate; }
  @keyframes bgPulse { to { transform: scale(1.08); } }
  @keyframes bgDrift { 0% { transform: translate(0, 0); } 33% { transform: translate(3vw, -2vh); } 66% { transform: translate(-2vw, 3vh); } 100% { transform: translate(2vw, 1vh); } }

  .ghost { position: absolute; left: 5vw; bottom: 8vh; z-index: -1; font-weight: 900; line-height: .8; letter-spacing: -.06em;
    font-size: min(34vw, 62vh); color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.06); user-select: none; }
  .scene.on .ghost { animation: ghostIn 1.4s var(--ease) .1s both; }
  @keyframes ghostIn { from { transform: translateX(-12vw); opacity: 0; } to { transform: none; opacity: 1; } }

  .copy { position: relative; min-width: 0; max-width: 780px; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; font-size: calc(var(--k) * clamp(10px, min(1.05vw, 1.9vh), 15px)); font-weight: 700;
    letter-spacing: .28em; text-transform: uppercase; color: var(--a1); }
  .kicker .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 0 18px var(--a1); }
  .kicker .bar { width: 0; height: 2px; background: linear-gradient(90deg, var(--a1), transparent); }
  .scene.on .kicker { animation: fadeUp .7s var(--ease) .15s both; }
  .scene.on .kicker .bar { animation: grow 1s var(--ease) .5s both; }
  @keyframes grow { to { width: 70px; } }

  /* Each word clips its letters while they rise: the box leaves room above for
     accents (É, Ä) and below for descenders (g, p, y), so nothing is cut. */
  .title { margin: 1.4vh 0 2vh; font-weight: 900; letter-spacing: -.045em; line-height: 1;
    font-size: calc(var(--k) * clamp(34px, min(7.6vw, 12.5vh), 140px)); overflow-wrap: normal; }
  .title .w { display: inline-block; overflow: hidden; padding: .16em .14em .28em .1em; margin: -.14em .06em -.26em -.1em; vertical-align: top; }
  /* The gradient of each letter is painted inside its own box. The title has a
     negative letter spacing, so the box reaches past the sides of wide letters
     (S, 0) as well as above the accents and below the descenders, or they are
     left blank. The negative margins keep the spacing as it was. */
  .title .l { display: inline-block; padding: .14em .1em .26em; margin: -.14em -.1em -.26em; transform: translateY(125%) rotate(6deg); opacity: 0;
    /* Same gradient as before over the letter itself: the stops are moved to
       the taller box (.14em above, 1em of letter, .26em below). */
    background: linear-gradient(180deg, #fff 17%, color-mix(in srgb, var(--a1) 85%, #fff) 60%, var(--a2) 81%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .scene.on .title .l { animation: rise .95s var(--ease) both; animation-delay: calc(.3s + var(--i) * .045s); }
  @keyframes rise { to { transform: none; opacity: 1; } }

  .tag { font-size: calc(var(--k) * clamp(16px, min(2.1vw, 3.6vh), 34px)); font-weight: 600; line-height: 1.22; max-width: 22em; color: #fff3df; }
  .tag b { font-weight: 800; background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .scene.on .tag { animation: fadeUp .9s var(--ease) .75s both; }
  .desc { margin-top: 1.4vh; font-size: calc(var(--k) * clamp(12px, min(1.25vw, 2.2vh), 19px)); line-height: 1.5; max-width: 38em; color: var(--mut); }
  .scene.on .desc { animation: fadeUp .9s var(--ease) .95s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2.6vh; }
  .chips li { padding: .6em 1.1em; border-radius: 999px; font-size: calc(var(--k) * clamp(11px, min(1.1vw, 2vh), 16px)); font-weight: 600; color: #ffe9c9;
    border: 1px solid color-mix(in srgb, var(--a1) 45%, transparent); background: color-mix(in srgb, var(--a2) 14%, rgba(255,255,255,.03));
    backdrop-filter: blur(6px); opacity: 0; transform: scale(.6); }
  .scene.on .chips li { animation: popIn .6s var(--pop) both; animation-delay: calc(1.05s + var(--i) * .11s); }
  @keyframes popIn { to { opacity: 1; transform: none; } }
  .badge { display: inline-block; margin-left: .4em; padding: .5em 1.1em; border-radius: 999px; font-size: calc(var(--k) * clamp(10px, min(1.1vw, 2vh), 16px)); line-height: 1; vertical-align: middle;
    font-weight: 800; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; -webkit-text-fill-color: currentColor;
    color: #1a0d03; background: linear-gradient(90deg, var(--a1), var(--a2)); box-shadow: 0 0 24px color-mix(in srgb, var(--a1) 60%, transparent); }
  .scene.on .badge { animation: popIn .6s var(--pop) .9s both; opacity: 0; transform: scale(.6); }

  /* ---------- icon ---------- */
  .art { position: relative; display: grid; place-items: center; aspect-ratio: 1; width: min(100%, 58vh, 40vw); justify-self: center;
    transform: translate3d(calc(var(--mx, 0) * 24px), calc(var(--my, 0) * 18px), 0); transition: transform .25s ease-out; }
  .art > * { grid-area: 1 / 1; }
  .icon { width: 82%; height: 82%; object-fit: contain; position: relative; z-index: 3; opacity: 0;
    filter: drop-shadow(0 34px 60px color-mix(in srgb, var(--a2) 55%, transparent)); }
  .scene.on .icon { animation: iconIn 1.25s var(--pop) .2s both, float 5.5s ease-in-out 1.5s infinite; }
  @keyframes iconIn {
    0% { opacity: 0; transform: scale(.15) rotate(-28deg) translateY(90px); filter: blur(22px) drop-shadow(0 0 0 transparent); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; filter: blur(0) drop-shadow(0 34px 60px color-mix(in srgb, var(--a2) 55%, transparent)); } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2.2%) rotate(1.6deg); } }

  .ring { border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--a1) 40%, transparent); z-index: 2; opacity: 0; transform: scale(.3); }
  .ring.r1 { width: 94%; height: 94%; }
  .ring.r2 { width: 110%; height: 110%; border-style: dashed; border-color: color-mix(in srgb, var(--a2) 38%, transparent); }
  .ring.r3 { width: 128%; height: 128%; border-color: color-mix(in srgb, var(--a1) 16%, transparent); }
  .scene.on .ring { animation: ringIn 1.1s var(--ease) both; }
  .scene.on .ring.r1 { animation-delay: .35s; }
  .scene.on .ring.r2 { animation: ringIn 1.1s var(--ease) .5s both, spin 40s linear 1.6s infinite; }
  .scene.on .ring.r3 { animation-delay: .65s; }
  @keyframes ringIn { to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- second composition, as in the installer ----------
     Every other app puts the icon on the left and the text on the right; the
     big number and the glow move to the other side, and the icon comes in from the side. */
  .layout-left { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); }
  .layout-left .art { order: -1; }
  .layout-left .ghost { left: auto; right: 5vw; }
  .scene.layout-left.on .icon { animation: iconInSide 1.25s var(--pop) .2s both, float 5.5s ease-in-out 1.5s infinite; }
  @keyframes iconInSide {
    0% { opacity: 0; transform: translateX(-60%) rotate(-40deg) scale(.5); filter: blur(16px) drop-shadow(0 0 0 transparent); }
    100% { opacity: 1; transform: none; filter: blur(0) drop-shadow(0 34px 60px color-mix(in srgb, var(--a2) 55%, transparent)); } }

  .orbit { border-radius: 50%; z-index: 4; pointer-events: none; opacity: 0; }
  .orbit i { position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
    background: linear-gradient(135deg, #fff, var(--a1)); box-shadow: 0 0 20px 4px var(--a1); }
  .orbit.o1 { width: 100%; height: 100%; }
  .orbit.o2 { width: 118%; height: 118%; }
  .orbit.o2 i { width: 9px; height: 9px; top: -4px; margin-left: -4px; background: var(--a2); box-shadow: 0 0 16px 3px var(--a2); }
  .scene.on .orbit { opacity: 1; transition: opacity .6s ease 1.2s; }
  .scene.on .orbit.o1 { animation: spin 9s linear 1.2s infinite; }
  .scene.on .orbit.o2 { animation: spin 14s linear 1.2s infinite reverse; }

  /* ---------- cover ---------- */
  .intro { grid-template-columns: 1fr; text-align: center; justify-items: center; align-content: center; }
  .intro .copy { max-width: 1100px; display: flex; flex-direction: column; align-items: center; }
  .intro .title { font-size: calc(var(--k) * clamp(48px, min(13vw, 19vh), 240px)); line-height: .95; margin: 1.6vh 0 2vh; }
  .intro .title .line { display: block; white-space: nowrap; }
  .intro .title .w { margin-right: .12em; }
  .intro .tag { margin: 0 auto; max-width: 28em; }
  .marq { position: absolute; left: 0; right: 0; z-index: -1; display: flex; gap: 3vw; width: max-content; opacity: .2; filter: blur(1.5px); }
  .marq img { width: 15vh; height: 15vh; object-fit: contain; }
  .marq.m1 { top: 5vh; animation: marqL 50s linear infinite; }
  .marq.m2 { bottom: 9vh; animation: marqR 60s linear infinite; }
  @keyframes marqL { to { transform: translateX(-50%); } }
  @keyframes marqR { from { transform: translateX(-50%); } to { transform: none; } }
  .start { margin-top: 3.4vh; display: inline-flex; align-items: center; gap: 12px; padding: .9em 1.8em; border-radius: 999px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    font-size: calc(var(--k) * clamp(11px, min(1.1vw, 2vh), 16px)); color: #1a0d03; background: linear-gradient(90deg, var(--o1), var(--o2)); box-shadow: 0 10px 50px rgba(255,138,20,.45);
    transition: transform .2s; }
  .start:hover { transform: translateY(-2px) scale(1.03); }
  .start svg { width: 1.2em; height: 1.2em; fill: currentColor; }
  .scene.on .start { animation: popIn .7s var(--pop) 1.5s both; opacity: 0; transform: scale(.6); }

  /* ---------- closing ---------- */
  .outro { grid-template-columns: 1fr; text-align: center; justify-items: center; align-content: center; gap: 2.6vh; }
  .outro .title { font-size: calc(var(--k) * clamp(40px, min(8vw, 13vh), 150px)); margin: 0; }
  .wall { display: grid; grid-template-columns: repeat(8, 1fr); gap: clamp(8px, 1.4vw, 22px); width: min(92vw, 1100px, 120vh); }
  .wall img { width: 100%; aspect-ratio: 1; object-fit: contain; opacity: 0; transform: scale(.2) rotate(-20deg); cursor: pointer; transition: filter .3s; filter: drop-shadow(0 14px 22px rgba(255,120,20,.25)); }
  .wall img:hover { filter: drop-shadow(0 14px 34px rgba(255,170,40,.7)); }
  .scene.on .wall img { animation: popIn .7s var(--pop) both, bob 5s ease-in-out infinite; animation-delay: calc(.4s + var(--i) * .06s), calc(1.6s + var(--i) * .2s); }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .again { padding: .8em 1.6em; border-radius: 999px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: clamp(11px, 1vw, 14px);
    border: 1px solid rgba(255,194,31,.5); color: var(--o1); }
  .again:hover { background: rgba(255,194,31,.12); }

  /* ---------- the way out, as in the installer ----------
     Every element of a scene leaves before the next scene comes in: the letters
     fall, the texts slide away, the chips shrink and the icon spins to its side. */
  /* .leaving stays on the scene until it has faded away, so its texts do not
     come back for a moment when it stops being the current one. */
  .scene.leaving .kicker { animation: outUp .35s ease-in both; }
  .scene.leaving .title .l { animation: fallOut .45s cubic-bezier(.5, 0, .9, .4) both; animation-delay: calc(var(--i) * .018s); }
  .scene.leaving .tag { animation: outLeft .45s ease-in .05s both; }
  .scene.leaving .desc { animation: outLeft .45s ease-in .1s both; }
  .scene.leaving .chips li { animation: shrinkOut .3s ease-in both; animation-delay: calc(var(--i) * .05s); }
  .scene.leaving .badge, .scene.leaving .start, .scene.leaving .again { animation: shrinkOut .3s ease-in both; }
  .scene.leaving .art { animation: artOut .6s cubic-bezier(.6, 0, .9, .5) both; }
  .scene.layout-left.leaving .art { animation-name: artOutLeft; }
  .scene.leaving .wall img { animation: shrinkOut .35s ease-in both; animation-delay: calc(var(--i) * .03s); }
  .scene.leaving .ghost { animation: fadeOut .5s ease-in both; }
  /* The rows of icons of the cover fade while they keep sliding: an exit
     animation would replace their slide, and they would jump back to the start. */
  .marq { transition: opacity .5s ease-in; }
  .scene.leaving .marq { opacity: 0; }
  @keyframes outUp { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-16px); } }
  @keyframes fallOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(110%) rotate(8deg); } }
  @keyframes outLeft { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-40px); } }
  @keyframes shrinkOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.4); } }
  @keyframes artOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(30vw) rotate(25deg) scale(.6); } }
  @keyframes artOutLeft { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-30vw) rotate(-25deg) scale(.6); } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* ---------- HUD ---------- */
  .brand { position: fixed; z-index: 30; top: 3.4vh; left: 3vw; display: flex; align-items: center; gap: 12px; font-size: clamp(10px, .95vw, 13px);
    letter-spacing: .3em; font-weight: 800; text-transform: uppercase; color: #ffe9c9; }
  .brand b { width: 30px; height: 3px; background: linear-gradient(90deg, var(--o1), var(--o3)); display: inline-block; border-radius: 2px; }
  .topright { position: fixed; z-index: 30; top: 2.6vh; right: 3vw; display: flex; align-items: center; gap: 18px; }
  .hint { font-size: clamp(10px, .85vw, 12px); letter-spacing: .12em; color: var(--mut); text-transform: uppercase; }
  .hint kbd { font: inherit; padding: .15em .55em; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; margin: 0 2px; color: #ffe9c9; }
  .close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); display: none; place-items: center; transition: background .2s, transform .2s; }
  .close:hover { background: rgba(255,194,31,.16); transform: scale(1.08); }
  .close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .hud { position: fixed; z-index: 30; left: 3vw; right: 3vw; bottom: 3.4vh; display: flex; align-items: center; gap: 20px; }
  .count { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: .08em; font-size: clamp(13px, 1.2vw, 18px); min-width: 5.2em; }
  .count em { font-style: normal; color: var(--mut); font-weight: 600; }
  .segs { flex: 1; display: flex; gap: 4px; height: 22px; align-items: center; }
  .seg { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; overflow: hidden; cursor: pointer; transition: height .2s, background .2s; }
  .seg:hover { height: 10px; background: rgba(255,255,255,.28); }
  .seg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--o1), var(--o3)); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .ctl { display: flex; gap: 6px; }
  .ctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); display: grid; place-items: center; transition: background .2s, transform .2s; }
  .ctl button:hover { background: rgba(255,194,31,.16); transform: scale(1.08); }
  .ctl svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .overview { position: fixed; inset: 0; z-index: 40; background: rgba(9,9,12,.92); backdrop-filter: blur(16px); display: none; place-items: center; padding: 6vh 6vw; }
  .overview.on { display: grid; }
  .overview .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; width: min(1200px, 100%); max-height: 100%; overflow: auto; }
  .card { text-align: center; padding: 14px 10px 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); transition: transform .2s, border-color .2s, background .2s; }
  .card:hover { transform: translateY(-4px); border-color: var(--o2); background: rgba(255,138,20,.1); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .card span { display: block; margin-top: 6px; font-size: 13px; font-weight: 700; }

  /* While it runs, the brand, the controls and the progress bar go away after
     a moment without moving the mouse, as in a video player, and come back
     with the mouse or a touch. */
  .brand, .topright, .hud { transition: opacity .35s ease, visibility 0s; }
  body.idle .brand, body.idle .topright, body.idle .hud { opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s .8s; }
  body.idle { cursor: none; }

  /* In a window of the site (?modal=1) the close button replaces the full screen key. */
  body.modal .close { display: grid; }
  /* The window opens by growing from the cover in the home page, so its cover
     is already in place: its entrance is not played again. */
  .intro.instant .kicker, .intro.instant .title .l, .intro.instant .tag, .intro.instant .start { animation: none; opacity: 1; transform: none; }
  .intro.instant .kicker .bar { animation: none; width: 70px; }
  /* The button only invites to open the presentation from the home page; once
     it runs there is nothing to start. It fades away and keeps its room, so
     the rest of the cover does not move. */
  body:not(.embed) .intro .start { animation: none; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .4s ease, visibility 0s .4s; }

  /* ---------- embedded in the home page (?embed=1) ----------
     Only the cover, stopped: no curtain, no embers, no HUD and no moving
     background. A click anywhere asks the page to open the presentation. */
  body.embed { cursor: pointer; }
  body.embed .hud, body.embed .topright, body.embed #fx { display: none; }
  body.embed .grid-bg, body.embed .marq, body.embed .glow-drift, body.embed .glow i { animation-play-state: paused; }
  body.embed .intro { padding: 7vh 5vw; }
  body.embed .marq img { width: 17vh; height: 17vh; }
  body.embed .brand { top: 5vh; left: 3vw; }

  /* Narrow screens take the composition of the vertical version of the
     presentation (9:16): the icon large on top, bigger type, the wall in 4×4. */
  @media (max-width: 900px) {
    .scene, .layout-left { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 3vh;
      padding: 9vh 7vw 13vh; text-align: center; justify-items: center; }
    .art { order: -1; width: min(72vw, 40vh); }
    .ghost, .layout-left .ghost { left: 5vw; right: auto; }
    .copy { max-width: 100%; }
    .kicker { font-size: calc(var(--k) * clamp(10px, 3vw, 15px)); }
    .title { font-size: calc(var(--k) * clamp(32px, 11.3vw, 90px)); margin: 1vh 0 1.4vh; }
    .tag { font-size: calc(var(--k) * clamp(16px, 5vw, 30px)); margin: 0 auto; }
    .desc { font-size: calc(var(--k) * clamp(13px, 3.6vw, 19px)); margin-left: auto; margin-right: auto; }
    .chips { justify-content: center; }
    .chips li { font-size: calc(var(--k) * clamp(11px, 3.2vw, 16px)); }
    .intro .title { font-size: calc(var(--k) * clamp(48px, 19vw, 160px)); }
    .start { font-size: calc(var(--k) * clamp(12px, 3.4vw, 16px)); }
    .outro .title { font-size: calc(var(--k) * clamp(36px, 14vw, 110px)); }
    .wall { grid-template-columns: repeat(4, 1fr); width: min(86vw, 60vh); }
    .hint { display: none; }
  }

  /* With reduced motion everything is shown in its final state at once.
     The icon is made visible here too: before, it stayed hidden. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .scene.on .title .l, .scene.on .icon, .scene.on .chips li, .scene.on .start, .scene.on .wall img, .scene.on .badge { opacity: 1; transform: none; }
    .scene.on .ring { opacity: 1; transform: none; }
    .scene.on .kicker .bar { width: 70px; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-drift"><div class="glow" id="glow"><i></i></div><div class="glow low" id="glowLow"><i></i></div></div>
<canvas id="fx"></canvas>
<div id="stage"></div>

<div class="brand"><b></b>Soplos Linux · Apps 3.0</div>
<div class="topright">
  <div class="hint" id="hint"></div>
  <button class="close" id="bClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="hud">
  <div class="count" id="count"></div>
  <div class="segs" id="segs"></div>
  <div class="ctl">
    <button id="bPrev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="bPlay"><svg viewBox="0 0 24 24" id="icoPause"><path d="M9 5v14M15 5v14"/></svg></button>
    <button id="bNext"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="bGrid"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
  </div>
</div>
<div class="overview" id="overview"><div class="cards" id="cards"></div></div>

<script src="texts.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  // ?embed=1: inside the home page of the site. It starts stopped on its cover;
  // when the page makes it fill the screen it says "play" and the presentation
  // runs, with its controls and a close button; "stop" takes it back to the
  // cover, stopped. The page and the presentation talk with postMessage.
  const IN_SITE = params.has('embed') || params.has('modal');
  let embedded = params.has('embed');
  document.body.classList.toggle('embed', embedded);
  document.body.classList.toggle('modal', IN_SITE && !embedded);

  const LANGS = Object.keys(SOPLOS.i18n);
  const storedLang = () => { try { return localStorage.getItem('soplosLanguage'); } catch { return null; } };
  const pickLang = () => [params.get('lang'), storedLang(), 'en'].find(l => l && LANGS.includes(l));
  let lang = pickLang();

  // Texts of the current language, with English as fallback.
  const T = () => SOPLOS.i18n[lang] || SOPLOS.i18n.en;
  const ui = (k) => (T().ui[k] ?? SOPLOS.i18n.en.ui[k]);
  const appText = (slug) => ({ ...SOPLOS.i18n.en.apps[slug], ...(T().apps[slug] || {}) });

  const APPS = SOPLOS.apps;
  const N = APPS.length + 2;          // cover + apps + closing
  const DUR = 7000;                   // ms per scene
  const stage = document.getElementById('stage');
  const pad = n => String(n).padStart(2, '0');
  const tell = (type) => { if (parent !== window) parent.postMessage({ type }, location.origin); };

  const words = (txt) => txt.split(' ').map((w, wi, arr) => {
    const off = arr.slice(0, wi).join(' ').length + (wi ? 1 : 0);
    return '<span class="w">' + [...w].map((c, ci) => `<span class="l" style="--i:${off + ci}">${c}</span>`).join('') + '</span>';
  }).join(' ');

  let scenes = [], segEls = [];

  function build() {
    document.documentElement.lang = lang;
    stage.innerHTML = '';
    scenes = [];

    // cover
    const intro = document.createElement('section');
    intro.className = 'scene intro';
    intro.style.setProperty('--a1', '#ffc21f'); intro.style.setProperty('--a2', '#ff6a12');
    const row = APPS.map(a => `<img src="images/${a.slug}.png" alt="">`).join('');
    intro.innerHTML = `<div class="marq m1">${row}${row}</div><div class="marq m2">${row}${row}</div>
      <div class="copy">
        <div class="kicker"><span class="dot"></span>${ui('kicker')}<span class="bar"></span></div>
        <h1 class="title"><span class="line">${words('SOPLOS')}</span><span class="line">${words('APPS 3.0')}</span></h1>
        <p class="tag">${ui('tagline')}</p>
        <button class="start" id="go"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>${ui('watch')}</button>
      </div>`;
    scenes.push(intro);

    APPS.forEach((a, i) => {
      const t = appText(a.slug);
      const s = document.createElement('section');
      s.className = i % 2 ? 'scene layout-left' : 'scene';
      s.style.setProperty('--a1', a.a1); s.style.setProperty('--a2', a.a2);
      s.innerHTML = `<div class="ghost">${pad(i + 1)}</div>
        <div class="copy">
          <div class="kicker"><span class="dot"></span>${t.cat}<span class="bar"></span></div>
          <h1 class="title">${words(a.name)}${a.soon ? `<span class="badge">${ui('soon')}</span>` : ''}</h1>
          <p class="tag">${t.tag}</p>
          <p class="desc">${t.desc}</p>
          <ul class="chips">${t.chips.map((c, k) => `<li style="--i:${k}">${c}</li>`).join('')}</ul>
        </div>
        <div class="art">
          <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
          <div class="orbit o2"><i></i></div><div class="orbit o1"><i></i></div>
          <img class="icon" src="images/${a.slug}.png" alt="${a.name}">
        </div>`;
      scenes.push(s);
    });

    // closing
    const outro = document.createElement('section');
    outro.className = 'scene outro';
    outro.style.setProperty('--a1', '#ffc21f'); outro.style.setProperty('--a2', '#ff5a14');
    outro.innerHTML = `<div class="kicker"><span class="dot"></span>Soplos Linux<span class="bar"></span></div>
      <h1 class="title">${words(ui('outroTitle'))}</h1>
      <div class="wall">${APPS.map((a, i) => `<img src="images/${a.slug}.png" alt="${a.name}" title="${a.name}" data-go="${i + 1}" style="--i:${i}">`).join('')}</div>
      <button class="again" id="again">${ui('again')}</button>`;
    scenes.push(outro);
    scenes.forEach(s => stage.appendChild(s));

    // HUD and texts outside the scenes
    const segs = document.getElementById('segs');
    segs.innerHTML = '';
    segEls = scenes.map((_, i) => { const d = document.createElement('div'); d.className = 'seg'; d.onclick = () => go(i); segs.appendChild(d); return d; });
    document.getElementById('cards').innerHTML = APPS.map((a, i) => `<button class="card" data-go="${i + 1}"><img src="images/${a.slug}.png" alt=""><span>${a.name}</span></button>`).join('');
    document.getElementById('hint').innerHTML = ui('hint');
    for (const [id, key] of [['bPrev', 'prev'], ['bNext', 'next'], ['bGrid', 'index'], ['bClose', 'close']]) {
      const b = document.getElementById(id); b.setAttribute('aria-label', ui(key)); b.title = ui(key);
    }
    setPlay(playing);

    document.getElementById('go').onclick = (e) => { if (embedded) { e.stopPropagation(); tell('soplos-apps:open'); } else next(); };
    document.getElementById('again').onclick = () => go(0);
    outro.addEventListener('click', e => { const b = e.target.closest('img[data-go]'); if (b) go(+b.dataset.go); });
  }

  // Shrinks the texts of a scene until its content fits in the window, so no
  // language or window size leaves a text cut or on top of another one.
  // Only the real content is measured (the texts, the icon box, the wall): the
  // rings, the orbits and the big number go beyond their boxes on purpose.
  function fit(s) {
    if (!s) return;
    let k = 1;
    s.style.setProperty('--k', k);
    const cs = getComputedStyle(s);
    const avail = s.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const parts = s.querySelectorAll(':scope > .copy, :scope > .art, :scope > .kicker, :scope > .title, :scope > .wall, :scope > .again');
    const tooBig = () => {
      let top = Infinity, bottom = -Infinity;
      parts.forEach(p => { const r = p.getBoundingClientRect(); top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom); });
      if (bottom - top > avail + 1) return true;
      return [...s.querySelectorAll('.title .w')].some(w => w.offsetWidth > (w.closest('.copy') || s).clientWidth + 1);
    };
    while (tooBig() && k > .45) { k = +(k - .05).toFixed(2); s.style.setProperty('--k', k); }
  }

  // The big light goes behind the icon of the scene (to the right, or to the
  // left in the second composition) with the first color of the app; the small
  // one goes low to the opposite corner with the second color. Cover and
  // closing: centered, Soplos orange. Narrow screens: the icon is on top.
  const glows = [document.getElementById('glow'), document.getElementById('glowLow')];
  let glowAt = -1;
  function place(el, x, y, color) {
    const r = el.offsetWidth / 2;
    el.style.transform = `translate(${innerWidth * x / 100 - r}px, ${innerHeight * y / 100 - r}px)`;
    el.firstElementChild.style.setProperty('--b1', color);
  }
  function moveGlow(i) {
    // The first time they are put in place at once, not slid from the corner.
    const first = glowAt < 0;
    if (first) glows.forEach(g => { g.style.transition = 'none'; });
    glowAt = i;
    const app = APPS[i - 1];
    const narrow = innerWidth <= 900;
    const left = app && (i - 1) % 2 === 1;
    // On a narrow screen every scene has the same composition, so the lights
    // stay where they are and only change color: the big one behind the icon,
    // the small one right behind the big number (the box of the number of the
    // first app, without the transform of its entrance), also on the cover and
    // the closing.
    let [gx, gy, hx, hy] = !app ? [50, 42, 50, 108] : left ? [24, 50, 90, 108] : [76, 50, 10, 108];
    if (narrow) {
      [gx, gy] = [50, 32];
      const ghost = scenes[1] && scenes[1].querySelector('.ghost');
      [hx, hy] = ghost
        ? [(ghost.offsetLeft + ghost.offsetWidth / 2) / innerWidth * 100, (ghost.offsetTop + ghost.offsetHeight / 2) / innerHeight * 100]
        : [20, 85];
    }
    place(glows[0], gx, gy, app ? app.a1 : '#ffc21f');
    place(glows[1], hx, hy, app ? app.a2 : (i === 0 ? '#ff6a12' : '#ff4a14'));
    if (first) glows.forEach(g => { void g.offsetWidth; g.style.transition = ''; });
  }
  // On a resize (also while the page makes the presentation grow) the lights
  // follow at once instead of gliding after it.
  addEventListener('resize', () => {
    glows.forEach(g => { g.style.transition = 'none'; });
    moveGlow(glowAt);
    glows.forEach(g => { void g.offsetWidth; g.style.transition = ''; });
  });

  const count = document.getElementById('count');
  const EXIT_MS = 750;                // the way out of a scene, as in the installer
  let cur = -1, elapsed = 0, playing = !embedded, busy = false;

  function show(i) {
    scenes[i].classList.remove('leaving');   // back to a scene that was still leaving
    scenes.forEach((s, k) => s.classList.toggle('on', k === i));
    moveGlow(i);
    cur = i; elapsed = 0;
    fit(scenes[i]);
    count.innerHTML = `${pad(i + 1)} <em>/ ${pad(N)}</em>`;
    segEls.forEach((e, k) => e.style.setProperty('--p', k < i ? 1 : 0));
  }
  function go(i, instant) {
    i = (i + N) % N;
    if (i === cur || busy) return;
    if (instant || cur < 0 || reduce) { show(i); return; }
    busy = true;
    const leaving = scenes[cur];
    leaving.classList.add('leaving');
    setTimeout(() => {
      show(i);
      busy = false;
      // Taken off once the scene has faded away (its opacity takes .45s).
      // The cover keeps .instant until then: taken off while it leaves, the
      // line of its kicker started growing again from nothing.
      setTimeout(() => { if (!leaving.classList.contains('on')) leaving.classList.remove('leaving', 'instant'); }, 500);
    }, EXIT_MS);
  }
  const next = () => go(cur + 1), prev = () => go(cur - 1);

  // timer
  let last = performance.now();
  function tick(t) {
    const dt = t - last; last = t;
    if (playing && !busy && cur >= 0 && cur < N - 1 && !document.hidden) {
      elapsed += dt;
      segEls[cur].style.setProperty('--p', Math.min(elapsed / DUR, 1));
      if (elapsed >= DUR) next();
    }
    requestAnimationFrame(tick);
  }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) playing = false;
  function setPlay(v) {
    playing = v;
    document.getElementById('icoPause').innerHTML = v ? '<path d="M9 5v14M15 5v14"/>' : '<path d="M7 4l12 8-12 8z"/>';
    const b = document.getElementById('bPlay'); b.setAttribute('aria-label', ui(v ? 'pause' : 'play')); b.title = ui(v ? 'pause' : 'play');
  }

  build();
  requestAnimationFrame(tick);

  // Controls. They are always connected, and do nothing while the presentation
  // is stopped on its cover inside the home page.
  document.getElementById('bNext').onclick = next;
  document.getElementById('bPrev').onclick = prev;
  document.getElementById('bPlay').onclick = () => setPlay(!playing);
  document.getElementById('bClose').onclick = () => tell('soplos-apps:close');
  const ov = document.getElementById('overview');
  const toggleOv = (v) => { ov.classList.toggle('on', v); };
  document.getElementById('bGrid').onclick = () => toggleOv(!ov.classList.contains('on'));
  ov.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { toggleOv(false); go(+b.dataset.go); } else if (e.target === ov) toggleOv(false); });
  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  addEventListener('keydown', e => {
    if (embedded) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') next();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prev();
    else if (e.key === ' ') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
    else if (e.key === 'g' || e.key === 'G') toggleOv(!ov.classList.contains('on'));
    else if ((e.key === 'f' || e.key === 'F') && !IN_SITE) fs();
    else if (e.key === 'Escape') { if (ov.classList.contains('on')) toggleOv(false); else if (IN_SITE) tell('soplos-apps:close'); }
  });
  addEventListener('mousemove', e => {
    if (embedded) return;
    document.body.style.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(3));
    document.body.style.setProperty('--my', (e.clientY / innerHeight - .5).toFixed(3));
  });
  // The bars hide after IDLE_MS without moving the mouse, but not while the
  // pointer is on them, the index is open or the presentation is stopped.
  const IDLE_MS = 2500;
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    if (embedded) return;
    idleTimer = setTimeout(function rest() {
      if (embedded) return;
      if (ov.classList.contains('on') || document.querySelector('.hud:hover, .topright:hover, .hud:focus-within, .topright:focus-within')) {
        idleTimer = setTimeout(rest, IDLE_MS);
        return;
      }
      document.body.classList.add('idle');
    }, IDLE_MS);
  }
  addEventListener('mousemove', wake);
  addEventListener('mousedown', wake);
  addEventListener('touchstart', wake, { passive: true });
  addEventListener('focusin', wake);

  let tx = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => {
    if (tx === null || embedded) { tx = null; return; }
    const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) (d < 0 ? next : prev)(); tx = null;
  });
  // Stopped on its cover, a click anywhere asks the page to open it.
  document.body.addEventListener('click', () => { if (embedded) tell('soplos-apps:open'); });

  // From stopped to running and back, as the page asks. Running, the cover
  // (the one that was on the page, already in place, without its button) is a
  // scene like the others: it keeps its full time, with the progress bar, and
  // then leaves as they do. Stopped, it goes back to the cover at once.
  function setEmbedded(v) {
    if (v === embedded) return;
    embedded = v;
    document.body.classList.toggle('embed', v);
    document.body.classList.toggle('modal', IN_SITE && !v);
    toggleOv(false);
    document.body.style.removeProperty('--mx'); document.body.style.removeProperty('--my');
    if (v) {
      setPlay(false);
      scenes.forEach(s => s.classList.remove('leaving'));
      busy = false;
      scenes[0].classList.add('instant');
      cur = -1; show(0);
    } else {
      elapsed = 0;
      setPlay(!reduce);
      startEmbers();
    }
    wake();
  }
  addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'soplos-apps:play') setEmbedded(false);
    else if (e.data.type === 'soplos-apps:stop') setEmbedded(true);
  });

  // #3 jumps to a scene. Inside the home page it starts on its cover.
  const h = parseInt(location.hash.slice(1), 10);
  if (embedded) scenes[0].classList.add('instant');
  go(Number.isFinite(h) && !embedded ? Math.max(0, Math.min(N - 1, h)) : 0, true);
  wake();

  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => fit(scenes[cur]), 120); });

  // The language follows the selector of the site: it writes soplosLanguage,
  // and the change reaches this page as a storage event.
  addEventListener('storage', (e) => {
    if (e.key !== 'soplosLanguage' || params.get('lang')) return;
    const l = pickLang();
    if (l === lang) return;
    lang = l;
    const at = cur; build(); cur = -1; show(at);
  });

  // embers
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  let W, H, P = [];
  const size = () => { const r = devicePixelRatio || 1; W = cv.width = innerWidth * r; H = cv.height = innerHeight * r; };
  addEventListener('resize', size); size();
  const mk = (init) => ({ x: Math.random() * W, y: init ? Math.random() * H : H + 20, r: (Math.random() * 2.2 + .6) * (devicePixelRatio || 1),
    v: Math.random() * .5 + .15, a: Math.random() * .6 + .2, w: Math.random() * Math.PI * 2, s: Math.random() * .01 + .004 });
  for (let i = 0; i < 110; i++) P.push(mk(true));
  // They only fly while the presentation runs (not stopped on its cover).
  let embersOn = false;
  function startEmbers() {
    if (embersOn || reduce) return;
    embersOn = true;
    (function draw() {
      if (embedded) { cx.clearRect(0, 0, W, H); embersOn = false; return; }
      cx.clearRect(0, 0, W, H); cx.globalCompositeOperation = 'lighter';
      for (const p of P) {
        p.y -= p.v * (devicePixelRatio || 1); p.w += p.s; p.x += Math.sin(p.w) * .4;
        if (p.y < -20) Object.assign(p, mk(false));
        const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
        g.addColorStop(0, `rgba(255,190,60,${p.a})`); g.addColorStop(.4, `rgba(255,110,20,${p.a * .35})`); g.addColorStop(1, 'rgba(255,80,10,0)');
        cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 7); cx.fill();
      }
      requestAnimationFrame(draw);
    })();
  }
  if (!embedded) startEmbers();
})();
</script>
</body>
</html>
