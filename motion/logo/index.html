<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soplos Linux · Logo</title>
<meta name="robots" content="noindex">
<style>
  /* Same background and same icon entrance as the Apps 3.0 presentation
     (apps/presentation): the grid, the two glows, the embers, the rings and
     the orbits. Here the icon is the S of Soplos, and under it SOPLOS opens
     into Sleek Optimized Platform for Linux Operating System. */
  :root {
    --bg: #09090c;
    --fg: #f7efe4;
    --o1: #ffc21f;
    --o2: #ff8a14;
    --o3: #ff4a14;
    --a1: #ffc21f;
    --a2: #ff6a12;
    --ease: cubic-bezier(.2, .9, .2, 1);
    --pop: cubic-bezier(.2, 1.25, .3, 1);
    --open: cubic-bezier(.7, 0, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: Inter, "Segoe UI", "Helvetica Neue", Ubuntu, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { cursor: pointer; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .grid-bg { position: fixed; inset: -2px; z-index: 0; pointer-events: none; opacity: .55;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%);
    animation: gridMove 18s linear infinite; }
  @keyframes gridMove { to { background-position: 64px 64px; } }

  /* ---------- the two glows, as in the presentation ---------- */
  @property --b1 { syntax: "<color>"; inherits: true; initial-value: #ffc21f; }
  .glow-drift { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    animation: bgDrift 23s ease-in-out infinite alternate; }
  .glow { position: absolute; left: 0; top: 0; width: max(112vw, 62vh); height: max(112vw, 62vh); will-change: transform;
    transition: transform 2.4s cubic-bezier(.6, 0, .3, 1); }
  .glow.low { width: max(88vw, 52vh); height: max(88vw, 52vh); }
  .glow i { position: absolute; inset: 0; border-radius: 50%; opacity: .36; will-change: transform;
    background: radial-gradient(circle closest-side, var(--b1), transparent 62%);
    transition: --b1 1.4s ease;
    animation: bgPulse 7s ease-in-out infinite alternate; }
  @keyframes bgPulse { to { transform: scale(1.08); } }
  @keyframes bgDrift { 0% { transform: translate(0, 0); } 33% { transform: translate(3vw, -2vh); } 66% { transform: translate(-2vw, 3vh); } 100% { transform: translate(2vw, 1vh); } }

  /* ---------- the scene ---------- */
  .scene { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; padding: 6vh 4vw; }

  /* ---------- the S, with the rings and orbits of the app icons ---------- */
  .art { position: relative; display: grid; place-items: center; aspect-ratio: 1; width: min(38vh, 62vw); flex: none; }
  .art > * { grid-area: 1 / 1; }
  .icon { width: 74%; height: 74%; object-fit: contain; position: relative; z-index: 3; opacity: 0;
    filter: drop-shadow(0 34px 60px color-mix(in srgb, var(--a2) 55%, transparent)); }
  .on .icon { animation: iconIn 1.25s var(--pop) .2s both, float 5.5s ease-in-out 1.5s infinite; }
  @keyframes iconIn {
    0% { opacity: 0; transform: scale(.15) rotate(-28deg) translateY(90px); filter: blur(22px) drop-shadow(0 0 0 transparent); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; filter: blur(0) drop-shadow(0 34px 60px color-mix(in srgb, var(--a2) 55%, transparent)); } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2.2%) rotate(1.6deg); } }

  .ring { border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--a1) 40%, transparent); z-index: 2; opacity: 0; transform: scale(.3); }
  .ring.r1 { width: 94%; height: 94%; }
  .ring.r2 { width: 110%; height: 110%; border-style: dashed; border-color: color-mix(in srgb, var(--a2) 38%, transparent); }
  .ring.r3 { width: 128%; height: 128%; border-color: color-mix(in srgb, var(--a1) 16%, transparent); }
  .on .ring { animation: ringIn 1.1s var(--ease) both; }
  .on .ring.r1 { animation-delay: .35s; }
  .on .ring.r2 { animation: ringIn 1.1s var(--ease) .5s both, spin 40s linear 1.6s infinite; }
  .on .ring.r3 { animation-delay: .65s; }
  @keyframes ringIn { to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .orbit { border-radius: 50%; z-index: 4; pointer-events: none; opacity: 0; }
  .orbit i { position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
    background: linear-gradient(135deg, #fff, var(--a1)); box-shadow: 0 0 20px 4px var(--a1); }
  .orbit.o1 { width: 100%; height: 100%; }
  .orbit.o2 { width: 118%; height: 118%; }
  .orbit.o2 i { width: 9px; height: 9px; top: -4px; margin-left: -4px; background: var(--a2); box-shadow: 0 0 16px 3px var(--a2); }
  .on .orbit { opacity: 1; transition: opacity .6s ease 1.2s; }
  .on .orbit.o1 { animation: spin 9s linear 1.2s infinite; }
  .on .orbit.o2 { animation: spin 14s linear 1.2s infinite reverse; }

  /* ---------- SOPLOS, and the phrase it turns into ----------
     The phrase is always laid out at its final size, the whole of it. Each
     initial starts moved and enlarged (--fx, --fy, --k, worked out in JS) so
     the six of them read SOPLOS, big, under the S. When it opens, every
     initial travels to its place in the phrase and shrinks to the size of the
     text, and the rest of its word comes in beside it, from blurred and
     transparent to sharp. Only whole letters move: nothing is ever clipped. */
  .name { display: flex; align-items: center; justify-content: center; width: 100%; flex: none; }
  .phrase { display: flex; align-items: baseline; white-space: nowrap; font-weight: 900; letter-spacing: -.035em; line-height: 1;
    font-size: var(--small, 40px); }
  .word { display: inline-flex; align-items: baseline; }
  .word:not(:last-child) { margin-right: .26em; }

  .ini { display: inline-block; transform-origin: 50% 50%;
    transform: translate(var(--fx, 0px), var(--fy, 0px)) scale(var(--k, 1));
    transition: transform 1.6s var(--open) calc(var(--i) * .05s); }
  .open .ini { transform: none; }
  /* The letter inside: the box reaches past it (as in the titles of the
     presentation) so its gradient is not cut; the negative margins keep the
     spacing as it was. It rises in on its own, while the initial is still big. */
  .ini b { display: inline-block; font-weight: inherit; padding: .14em .1em .26em; margin: -.14em -.1em -.26em;
    background: linear-gradient(180deg, #fff 17%, color-mix(in srgb, var(--a1) 85%, #fff) 60%, var(--a2) 81%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(70%) rotate(6deg); }
  .on .ini b { animation: rise .95s var(--ease) both; animation-delay: calc(1.25s + var(--i) * .07s); }
  @keyframes rise { to { transform: none; opacity: 1; } }

  /* The rest of each word, and "for": hidden until the initials arrive. */
  .rest { display: inline-block; color: #fff3df; opacity: 0; filter: blur(10px); transform: translateY(.18em);
    transition: opacity .8s ease, filter .8s ease, transform .8s var(--ease); transition-delay: calc(1.35s + var(--j) * .08s); }
  .open .rest { opacity: 1; filter: blur(0); transform: none; }

  /* Starting again: everything goes back at once, without transitions. */
  .reset *, .reset *::before, .reset *::after { transition: none !important; animation: none !important; }

  /* A line of light grows under the phrase once it is open. */
  .bar { height: 2px; width: 0; border-radius: 2px; flex: none; opacity: 0;
    background: linear-gradient(90deg, transparent, var(--o1), var(--o3), transparent);
    transition: width 1.2s var(--ease) 1.5s, opacity .6s ease 1.5s; }
  .open .bar { width: min(60vw, 560px); opacity: 1; }

  /* ---------- in the home page (?embed=1) ----------
     Hidden under the wallpaper of the hero card until a click brings it out
     to the whole screen: stopped meanwhile, with a close button once open. */
  body.embed:not(.modal) * { animation-play-state: paused !important; }
  .close { position: fixed; z-index: 30; top: 2.6vh; right: 3vw; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.22); background: none; color: var(--fg); display: none; place-items: center;
    cursor: pointer; transition: background .2s, transform .2s; }
  .close:hover { background: rgba(255,194,31,.16); transform: scale(1.08); }
  .close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  body.modal .close { display: grid; }

  /* Reduced motion: the last frame, still. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .icon, .ring, .orbit, .ini, .ini b { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-drift"><div class="glow" id="glow"><i></i></div><div class="glow low" id="glowLow"><i></i></div></div>
<canvas id="fx"></canvas>
<button type="button" class="close" id="close" aria-label="Close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<main class="scene" id="scene" aria-label="Soplos Linux: Sleek Optimized Platform for Linux Operating System">
  <div class="art" aria-hidden="true">
    <span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
    <span class="orbit o2"><i></i></span><span class="orbit o1"><i></i></span>
    <img class="icon" src="../../images/logo/soplos-logo.png" alt="">
  </div>
  <div class="name" id="name" aria-hidden="true">
    <div class="phrase" id="phrase">
      <span class="word"><span class="ini" style="--i:0"><b>S</b></span><span class="rest" style="--j:0">leek</span></span>
      <span class="word"><span class="ini" style="--i:1"><b>O</b></span><span class="rest" style="--j:1">ptimized</span></span>
      <span class="word"><span class="ini" style="--i:2"><b>P</b></span><span class="rest" style="--j:2">latform</span></span>
      <span class="word"><span class="rest" style="--j:3">for</span></span>
      <span class="word"><span class="ini" style="--i:3"><b>L</b></span><span class="rest" style="--j:4">inux</span></span>
      <span class="word"><span class="ini" style="--i:4"><b>O</b></span><span class="rest" style="--j:5">perating</span></span>
      <span class="word"><span class="ini" style="--i:5"><b>S</b></span><span class="rest" style="--j:6">ystem</span></span>
    </div>
  </div>
  <div class="bar" aria-hidden="true"></div>
</main>

<script>
(() => {
  // ?loop=1 plays it again and again; otherwise it stays on the last frame,
  // and a click (or R) plays it again.
  // ?embed=1: hidden in the hero card of the home page. It waits, stopped,
  // until the page has made it grow to the whole screen and says
  // "soplos-logo:play"; the close button and Esc ask the page to close it
  // ("soplos-logo:close"), and the page says "soplos-logo:stop".
  const params = new URLSearchParams(location.search);
  const LOOP = params.has('loop');
  const EMBED = params.has('embed');
  document.body.classList.toggle('embed', EMBED);
  const tell = (type) => { if (parent !== window) parent.postMessage({ type }, location.origin); };
  const shown = () => !EMBED || document.body.classList.contains('modal');
  const OPEN_AT = 3400;               // ms: SOPLOS opens into the phrase
  const LOOP_MS = 11000;              // ms: length of one play when it loops
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const body = document.body;
  const phrase = document.getElementById('phrase');
  const name = document.getElementById('name');
  const inis = [...phrase.querySelectorAll('.ini')];

  // Sizes and starting places. The phrase is measured at 100px (in em): its
  // whole width and the width of SOPLOS. The phrase fits the width of the
  // window (--small); the big word fills what it can under the S (big).
  // Then, with the phrase at its size, every initial gets the move and the
  // scale (--fx, --fy, --k) that put it in its place within a centered
  // SOPLOS of the big size.
  function measure() {
    phrase.style.fontSize = '100px';
    const openEm = phrase.scrollWidth / 100;
    const widths = inis.map(e => e.offsetWidth / 100);   // the advance of each letter, in em
    const closedEm = widths.reduce((a, b) => a + b, 0);
    const big = Math.min(innerHeight * .17, innerWidth * .82 / closedEm, 200);
    const small = Math.min(innerWidth * .9 / openEm, innerHeight * .075, 76);
    phrase.style.fontSize = '';
    phrase.style.setProperty('--small', small + 'px');
    name.style.height = big * 1.3 + 'px';   // the room of the big word, so nothing moves around it

    const k = big / small;
    const box = name.getBoundingClientRect();
    const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
    let x = cx - closedEm * big / 2;
    inis.forEach((e, i) => {
      // Its own place in the phrase: its center now, less the move it has.
      const r = e.getBoundingClientRect();
      const ox = r.left + r.width / 2, oy = r.top + r.height / 2;   // center now, transformed
      const fx = parseFloat(e.style.getPropertyValue('--fx')) || 0;
      const fy = parseFloat(e.style.getPropertyValue('--fy')) || 0;
      const open = body.classList.contains('open');
      const homeX = open ? ox : ox - fx, homeY = open ? oy : oy - fy;
      const target = x + widths[i] * big / 2;
      x += widths[i] * big;
      e.style.setProperty('--fx', (target - homeX) + 'px');
      e.style.setProperty('--fy', (cy - homeY) + 'px');
      e.style.setProperty('--k', k);
    });
  }

  // The two glows: the big one behind the S, the small one low in a corner.
  // When the phrase opens, the small one crosses to the other corner and the
  // big one warms up.
  const glows = [document.getElementById('glow'), document.getElementById('glowLow')];
  function place(el, x, y, color) {
    const r = el.offsetWidth / 2;
    el.style.transform = `translate(${innerWidth * x / 100 - r}px, ${innerHeight * y / 100 - r}px)`;
    el.firstElementChild.style.setProperty('--b1', color);
  }
  function lights(open, instant) {
    if (instant) glows.forEach(g => { g.style.transition = 'none'; });
    const art = document.querySelector('.art').getBoundingClientRect();
    const sy = (art.top + art.height / 2) / innerHeight * 100;
    place(glows[0], 50, sy, open ? '#ff8a14' : '#ffc21f');
    place(glows[1], open ? 14 : 86, 108, open ? '#ff4a14' : '#ff6a12');
    if (instant) glows.forEach(g => { void g.offsetWidth; g.style.transition = ''; });
  }

  let timers = [];
  function play() {
    timers.forEach(clearTimeout); timers = [];
    body.classList.add('reset');
    body.classList.remove('on', 'open');
    lights(false, true);
    void body.offsetWidth;
    body.classList.remove('reset');
    void body.offsetWidth;
    if (reduce) { body.classList.add('on', 'open'); lights(true, true); return; }
    body.classList.add('on');
    timers.push(setTimeout(() => { body.classList.add('open'); lights(true); }, OPEN_AT));
    if (LOOP) timers.push(setTimeout(play, LOOP_MS));
  }

  addEventListener('click', e => { if (shown() && !e.target.closest('#close')) play(); });
  addEventListener('keydown', e => {
    if (!shown()) return;
    if (e.key === 'r' || e.key === 'R') play();
    else if (e.key === 'Escape' && EMBED) tell('soplos-logo:close');
  });
  document.getElementById('close').addEventListener('click', () => tell('soplos-logo:close'));
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'soplos-logo:play') {
      body.classList.add('modal');
      measure();
      play();
      startEmbers();
    } else if (e.data.type === 'soplos-logo:stop') {
      // It keeps the frame it is on while it shrinks and fades into the card.
      body.classList.remove('modal');
      timers.forEach(clearTimeout); timers = [];
    }
  });
  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      body.classList.add('reset');
      measure();
      lights(body.classList.contains('open'), true);
      void body.offsetWidth;
      body.classList.remove('reset');
    }, 100);
  });

  // The sizes need the real font, so it starts once the fonts are ready.
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { measure(); if (!EMBED) play(); });

  // Embers, as in the presentation.
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  let W, H, P = [];
  const dpr = () => devicePixelRatio || 1;
  const size = () => { W = cv.width = innerWidth * dpr(); H = cv.height = innerHeight * dpr(); };
  addEventListener('resize', size); size();
  const mk = (init) => ({ x: Math.random() * W, y: init ? Math.random() * H : H + 20, r: (Math.random() * 2.2 + .6) * dpr(),
    v: Math.random() * .5 + .15, a: Math.random() * .6 + .2, w: Math.random() * Math.PI * 2, s: Math.random() * .01 + .004 });
  // They fly only while the motion is seen: hidden in the hero card
  // (?embed=1) they wait, and they are spread again over the whole screen
  // when it opens.
  let embersOn = false;
  function startEmbers() {
    if (embersOn || reduce) return;
    embersOn = true;
    size();
    P = [];
    for (let i = 0; i < 110; i++) P.push(mk(true));
    draw();
  }
  function draw() {
    if (!shown()) { cx.clearRect(0, 0, W, H); embersOn = false; return; }
    cx.clearRect(0, 0, W, H); cx.globalCompositeOperation = 'lighter';
    for (const p of P) {
      p.y -= p.v * dpr(); p.w += p.s; p.x += Math.sin(p.w) * .4;
      if (p.y < -20) Object.assign(p, mk(false));
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, `rgba(255,190,60,${p.a})`); g.addColorStop(.4, `rgba(255,110,20,${p.a * .35})`); g.addColorStop(1, 'rgba(255,80,10,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 7); cx.fill();
    }
    requestAnimationFrame(draw);
  }
  if (!EMBED) startEmbers();
})();
</script>
</body>
</html>
